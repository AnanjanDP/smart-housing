name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  core-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core-api/requirements.txt
      - name: Run Django Tests
        run: |
          cd services/core-api
          USE_SQLITE_DEV=True python manage.py test tests apps

  search-service-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: test_trgm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U u -d test_trgm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: test_trgm
      TEST_POSTGRES_USER: u
      TEST_POSTGRES_PASSWORD: pw
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/search-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/search-service
          pytest

  search-service-semantic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache embedding model
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/search-service/requirements.txt -r services/search-service/requirements-ml.txt
      - name: Run real-model tests
        run: |
          cd services/search-service
          RUN_MODEL_TESTS=1 pytest tests/test_real_embeddings.py

  recommendation-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/recommendation-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/recommendation-service
          pytest

  notification-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/notification-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/notification-service
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          SECRET_KEY=x POSTGRES_PASSWORD=x REDIS_PASSWORD=x ALLOWED_HOSTS=h TLS_CERT_DIR=./certs             CORS_ALLOWED_ORIGINS=https://h SMTP_HOST=h SMTP_USER=u SMTP_PASSWORD=p             docker compose -f docker-compose.prod.yml config -q
