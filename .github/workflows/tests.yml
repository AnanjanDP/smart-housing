name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  core-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core-api/requirements.txt
      - name: Run Django Tests
        run: |
          cd services/core-api
          USE_SQLITE_DEV=True python manage.py test tests

  search-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/search-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/search-service
          pytest

  search-service-semantic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache embedding model
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/search-service/requirements.txt -r services/search-service/requirements-ml.txt
      - name: Run real-model tests
        run: |
          cd services/search-service
          RUN_MODEL_TESTS=1 pytest tests/test_real_embeddings.py

  recommendation-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/recommendation-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/recommendation-service
          pytest

  notification-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/notification-service/requirements.txt
      - name: Run Pytest
        run: |
          cd services/notification-service
          pytest

