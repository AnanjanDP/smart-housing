name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-api
            context: ./services/core-api
          - name: search-service
            context: ./services/search-service
          - name: recommendation-service
            context: ./services/recommendation-service
          - name: notification-service
            context: ./services/notification-service
          - name: nginx
            context: ./infrastructure/nginx
    env:
      # Pushing needs registry credentials; without them every image is still built, so a broken Dockerfile fails the run.
      HAS_REGISTRY: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: env.HAS_REGISTRY == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ env.HAS_REGISTRY == 'true' }}
          tags: staymatch/${{ matrix.name }}:latest
