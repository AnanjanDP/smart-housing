# Search API and chat WebSockets. Idle chat sockets are kept open for an hour.
location /api/v1/search/ws/ {
    limit_req zone=search_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://search_service;
}

location /api/v1/search/ {
    limit_req zone=search_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://search_service;
}

location /api/v1/recommendations/ {
    limit_req zone=api_limit burst=15 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://recommendation_service;
}

# Sign-in, sign-up and token endpoints get a much tighter limit (password guessing).
location /api/v1/users/ {
    limit_req zone=auth_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://core_api;
}

location /api/v1/ {
    limit_req zone=api_limit burst=20 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://core_api;
}

# Hashed build assets are safe to cache for a year.
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

# Single page app fallback. index.html must not be cached or users keep old builds.
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
