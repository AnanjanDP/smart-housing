# nginx is the outermost proxy, so the client address is $remote_addr. X-Forwarded-For is overwritten rather
# than appended to: a caller-supplied header must never reach the services (it would defeat their rate limits).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 5s;
