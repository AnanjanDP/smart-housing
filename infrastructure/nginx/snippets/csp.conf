# Content-Security-Policy for the single page app (HTML responses).
#  - scripts only from this site (no inline scripts, no eval)
#  - styles from this site and Google Fonts; inline styles are allowed because React sets style attributes
#  - images from this site, data/blob URLs and any https host (listing photos and profile pictures)
#  - network calls to this site (including its WebSockets) and to Supabase for Google sign-in
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
