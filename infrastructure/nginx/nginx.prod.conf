# Production: HTTP redirects to HTTPS; TLS terminates here.
# Mount a certificate and key at /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $scheme $hsts {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    upstream core_api {
        server core-api:8000;
    }

    upstream search_service {
        server search-service:8001;
    }

    upstream recommendation_service {
        server recommendation-service:8002;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/snippets/locations.conf;
    }
}
