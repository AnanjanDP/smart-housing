# Reachable only on the compose network; the password is passed on the command line (--requirepass).
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000
maxmemory 256mb
maxmemory-policy allkeys-lru
rename-command FLUSHALL ""
rename-command CONFIG ""
