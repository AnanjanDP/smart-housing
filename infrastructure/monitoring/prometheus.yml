global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'core-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['core-api:8000']

  - job_name: 'search-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['search-service:8001']

  - job_name: 'recommendation-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['recommendation-service:8002']
