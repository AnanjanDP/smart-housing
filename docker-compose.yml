services:
  postgres:
    image: postgres:15-alpine
    container_name: staymatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staymatch_db}
      POSTGRES_USER: ${POSTGRES_USER:-staymatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staymatch_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staymatch_user} -d ${POSTGRES_DB:-staymatch_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staymatch-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-staymatch_redis_dev}

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: staymatch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: staymatch-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: staymatch-core-api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/core-api:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SECRET_KEY=${SECRET_KEY:-django-insecure-staymatch-default-key-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-staymatch_db}
      - POSTGRES_USER=${POSTGRES_USER:-staymatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staymatch_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-staymatch_redis_dev}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - ALLOW_INSECURE_DEMO_OAUTH=${ALLOW_INSECURE_DEMO_OAUTH:-False}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  celery-worker:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: staymatch-celery-worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./services/core-api:/app
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-staymatch_db}
      - POSTGRES_USER=${POSTGRES_USER:-staymatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staymatch_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-staymatch_redis_dev}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - postgres
      - redis


  outbox-relay:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: staymatch-outbox-relay
    command: python manage.py relay_outbox
    volumes:
      - ./services/core-api:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-staymatch-default-key-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-staymatch_db}
      - POSTGRES_USER=${POSTGRES_USER:-staymatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staymatch_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-staymatch_redis_dev}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DJANGO_SETTINGS_MODULE=config.settings.development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: staymatch-search-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-staymatch_db}
      - POSTGRES_USER=${POSTGRES_USER:-staymatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staymatch_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-sentence-transformers}
      - VECTOR_INDEX_DIR=/data/vector_index
      - INDEX_REFRESH_INTERVAL_SECONDS=${INDEX_REFRESH_INTERVAL_SECONDS:-60}
      - SEARCH_ADMIN_TOKEN=${SEARCH_ADMIN_TOKEN:-}
      - JWT_SIGNING_KEY=${SECRET_KEY:-django-insecure-staymatch-default-key-change-me}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./services/search-service:/app
      - search_index:/data/vector_index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: staymatch-recommendation-service
    volumes:
      - ./services/recommendation-service:/app
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - JWT_SIGNING_KEY=${SECRET_KEY:-django-insecure-staymatch-default-key-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-staymatch_db}
      - POSTGRES_USER=${POSTGRES_USER:-staymatch_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-staymatch_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: staymatch-notification-service
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://:${REDIS_PASSWORD:-staymatch_redis_dev}@redis:6379/0
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-no-reply@staymatch.com}
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: staymatch-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - core-api
      - search-service
      - recommendation-service

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: staymatch-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
  search_index:
